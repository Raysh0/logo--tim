<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Tim Sepak Bola</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            font-family: Arial, sans-serif;
        }
        h1 { color: #1a365d; margin-bottom: 30px; font-size: 24px; }
        .logo-container {
            position: relative;
            width: 220px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .shield {
            width: 180px;
            height: 220px;
            background: linear-gradient(180deg, #1e40af 0%, #3b82f6 100%);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 5px solid #ffffff;
        }
        .shield-border {
            position: absolute;
            width: 150px;
            height: 190px;
            border: 2px solid #ffffff;
            border-radius: 50% 50% 45% 45%;
        }
        .cross-ornament {
            position: absolute;
            top: 60px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }
        .cross {
            width: 25px;
            height: 25px;
            position: relative;
        }
        .cross::before, .cross::after {
            content: '';
            position: absolute;
            background: #ef4444;
        }
        .cross::before {
            width: 100%;
            height: 6px;
            top: 50%;
            transform: translateY(-50%);
        }
        .cross::after {
            width: 6px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        .shield-point {
            position: absolute;
            bottom: -25px;
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 45px solid #ef4444;
        }
        .garuda {
            position: relative;
            z-index: 10;
            color: #ffffff;
            font-size: 60px;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .team-name {
            margin-top: 40px;
            text-align: center;
        }
        .team-name h2 {
            color: #1a365d;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .team-name p {
            color: #64748b;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Logo Tim Sepak Bola</h1>
    <div class="logo-container">
        <div class="cross-ornament">
            <div class="cross"></div>
            <div class="cross"></div>
        </div>
        <div class="shield">
            <div class="shield-border"></div>
            <div class="garuda">🦅</div>
        </div>
        <div class="shield-point"></div>
    </div>
    <div class="team-name">
        <h2>NAMA TIM</h2>
        <p>Est. 2026</p>
    </div>
</body>
</html>
